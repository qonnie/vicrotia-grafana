services:
  victoriametrics:
    image: victoriametrics/victoria-metrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - '-retentionPeriod=12'
      - '-storageDataPath=/storage'
      - '-promscrape.config=/prometheus.yml'
    volumes:
      - ./vmdata:/storage
      - ./prometheus.yml:/prometheus.yml

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=adminet
      - GF_SECURITY_ADMIN_PASSWORD=Ymod6ti8
    depends_on:
      - victoriametrics
    volumes:
      - ./grafana:/var/lib/grafana
